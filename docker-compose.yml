version: "3.9"

services:
  hub-backend:
    build: ./backend
    container_name: hub-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
    networks:
      - hub-net

  hub-frontend:
    build: ./frontend
    container_name: hub-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - hub-backend
    networks:
      - hub-net

networks:
  hub-net:
    driver: bridge
